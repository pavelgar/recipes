name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# One run at a time per branch or tag, so edge is pushed in commit order. A
# new push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          # The version the Dockerfile builds with.
          bun-version: 1.4.4
      - run: sh scripts/setup-worktree.sh
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check
      # (src/server/import/fetch.server.ts). The image's build must leave it
      # out. The app's own chunks are those importing request-filtering-agent;
      # the library itself, in _libs, names the option too. Finding no chunks,
      # or grep failing to read them (status 2), fails the step as well.
      - run: bun run build
      - run: |
          app=$(grep -rl --exclude-dir=_libs --exclude-dir=node_modules request-filtering-agent .output/server)
          test -n "$app"
          status=0
          grep -n allowIPAddressList $app || status=$?
          test "$status" = 1
      # Component tests run in Chromium (vitest.config.ts).
      - run: bunx playwright install --with-deps chromium
      - run: bun run test

  # The app in Chromium and WebKit, on a phone and a computer, and over plain
  # HTTP (tests/e2e/playwright.config.ts).
  e2e:
    runs-on: ubuntu-24.04
    # Playwright's image comes with Node 24, the browsers and the libraries
    # they need, which take minutes to install otherwise. Its version is the
    # @playwright/test version bun.lock holds; when that changes, change
    # this too, or the tests can't find their browsers.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      # setup-bun unpacks Bun with unzip, which the image doesn't have. The
      # version the Dockerfile builds with.
      - run: npm install --global bun@1.4.4
      - run: sh scripts/setup-worktree.sh
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # Pull requests only build the image. Pushes to main publish edge and
  # sha-<commit>; tags such as v1.2.3 publish 1.2.3, 1.2, 1 and latest.
  image:
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # 0.x versions get no major-only tag, since 0 would span breaking
          # changes. The labels come from the Dockerfile, not from here.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge
            type=sha,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Shown in the app's settings: 1.2.3 or edge, and the commit.
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
            VITE_APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
